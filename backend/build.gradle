plugins {
    id 'groovy'
    id 'application'
}

group = 'br.com.linketinder'
version = '1.0.0'

repositories {
    mavenCentral()
}

run {
    standardInput = System.in
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.23'
    implementation 'org.apache.groovy:groovy-sql:4.0.23'
    implementation 'org.apache.groovy:groovy-json:4.0.23'

    implementation 'org.postgresql:postgresql:42.7.3'

    implementation 'org.apache.tomcat.embed:tomcat-embed-core:8.5.100'
    compileOnly     'javax.servlet:javax.servlet-api:3.1.0'

    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.com.linketinder.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'br.com.linketinder.Main'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations.all {
    resolutionStrategy {
        force 'org.apache.groovy:groovy:4.0.23'
        force 'org.apache.groovy:groovy-all:4.0.23'
        force 'org.apache.groovy:groovy-sql:4.0.23'
        force 'org.apache.groovy:groovy-json:4.0.23'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}